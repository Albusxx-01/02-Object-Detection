# Pascal VOC object-detection configuration.
# `path` is rewritten to an absolute path by src/config.py before Ultralytics
# reads the generated dataset YAML.

path: ../data
train: images/train
val: images/val
test: images/val

names:
  0: aeroplane
  1: bicycle
  2: bird
  3: boat
  4: bottle
  5: bus
  6: car
  7: cat
  8: chair
  9: cow
  10: diningtable
  11: dog
  12: horse
  13: motorbike
  14: person
  15: pottedplant
  16: sheep
  17: sofa
  18: train
  19: tvmonitor

training:
  model: yolov8n.pt
  epochs: 50
  imgsz: 640
  batch: 16
  workers: 8
  device: 0
  patience: 15
  optimizer: auto
  lr0: 0.01
  seed: 42
  pretrained: true
  augment: true
  project: results/runs
  name: yolov8n_voc

inference:
  conf: 0.25
  iou: 0.45
  max_det: 300
  imgsz: 640
